[package]
name = "x509-trust-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3"
rustls-pki-types = "1.15.1"
rustls-webpki = { version = "0.103.16", features = ["ring"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

[build-dependencies]
napi-build = "2"
